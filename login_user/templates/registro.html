{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <section class="vh-100">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-2-strong" style="border-radius: 1rem;">
                        <div class="card-body p-5">
                            <h3 class="mb-4 text-center">Cadastro</h3>
                            
                            <!-- Formulário de Registro -->
                            <form method="POST">
                                {% csrf_token %}
                                
                                <!-- Campo Nome -->
                                <div class="form-outline mb-4">
                                    <label class="form-label" for="first_name">Nome</label>
                                    <input type="text" id="first_name" name="first_name" class="form-control" required value="{{ first_name|default:'' }}" />
                                </div>
                                
                                <!-- Campo Sobrenome -->
                                <div class="form-outline mb-4">
                                    <label class="form-label" for="last_name">Sobrenome</label>
                                    <input type="text" id="last_name" name="last_name" class="form-control" required value="{{ last_name|default:'' }}" />
                                </div>
                                
                                <!-- Campo E-mail -->
                                <div class="form-outline mb-4">
                                    <label class="form-label" for="email">E-mail</label>
                                    <input type="email" id="email" name="email" class="form-control" required value="{{ email|default:'' }}" />
                                </div>
                                
                                <!-- Campo Senha -->
                                <div class="form-outline mb-4">
                                    <label class="form-label" for="password">Senha</label>
                                    <input type="password" id="password" name="password" class="form-control" required />
                                </div>
                                
                                <!-- Campo Confirmar Senha -->
                                <div class="form-outline mb-4">
                                    <label class="form-label" for="password2">Confirme a senha</label>
                                    <input type="password" id="password2" name="password2" class="form-control" required />
                                </div>
                                
                                <!-- Checkbox "Sou Fotógrafo" -->
                                <div class="form-check d-flex justify-content-center mb-4">
                                    <input class="form-check-input me-2" type="checkbox" name="is_photographer" id="is_photographer"
                                           {% if is_photographer %} checked {% endif %} />
                                    <label class="form-check-label" for="is_photographer">Sou fotógrafo</label>
                                </div>
                                
                                <!-- Botão de Cadastro -->
                                <button type="submit" class="btn btn-success btn-block">Cadastrar</button>
                            </form>

                            <!-- Link para Login -->
                            <div class="text-center mt-3">
                                <p class="small fw-bold mt-2 pt-1 mb-0">Já tem uma conta? <a href="{% url 'login' %}" class="link-danger">Faça login</a></p>
                            </div>

                            <!-- Exibição de Mensagens -->
                            {% if messages %}
                                <div class="mt-3">
                                    {% for message in messages %}
                                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                                    {% endfor %}
                                </div>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
