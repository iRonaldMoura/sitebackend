{% extends 'base-index.html' %}
{% load static %}

<!DOCTYPE html>
{% block 'cabecalho' %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Photopixel</title>

    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="{% static 'logo_f.png' %}" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="{% static 'styles.css' %}" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
{% endblock %}

{% block 'conteudo' %}
<!-- Seção principal com flexbox -->
<section class="d-flex flex-column min-vh-100">
    <div class="container-fluid h-custom flex-grow-1">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <img src="https://img.freepik.com/vetores-gratis/conceito-de-ilustracao-de-upload-de-imagem_114360-766.jpg?t=st=1733353089~exp=1733356689~hmac=fc6e8c94f83961caa0d0419d5f0c8adab631602d0ce25e299058052ffa722e18&w=740"
                    class="img-fluid" alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                <!-- Formulário de Login -->
                <form method="POST">
                    {% csrf_token %}  <!-- Token CSRF para segurança -->
                    
                    <div class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start">
                        <p class="lead fw-normal mb-0 me-3">Logue com</p>
                        <button type="button" class="btn btn-success btn-floating mx-1">
                            <i class="fab fa-facebook-f"></i>
                        </button>
                        <button type="button" class="btn btn-success btn-floating mx-1">
                            <i class="fab fa-twitter"></i>
                        </button>
                        <button type="button" class="btn btn-success btn-floating mx-1">
                            <i class="fab fa-linkedin-in"></i>
                        </button>
                    </div>

                    <div class="divider d-flex align-items-center my-4">
                        <p class="text-center fw-bold mx-3 mb-0">Ou</p>
                    </div>

                    <!-- Campo de E-mail -->
                    <div class="form-outline mb-4">
                        <input type="email" id="form3Example3" name="email" class="form-control form-control-lg"
                            placeholder="Entre com seu usuário cadastrado" required />
                        <label class="form-label" for="form3Example3">Usuário</label>
                    </div>

                    <!-- Campo de Senha -->
                    <div class="form-outline mb-3">
                        <input type="password" id="form3Example4" name="password" class="form-control form-control-lg"
                            placeholder="Insira sua senha" required />
                        <label class="form-label" for="form3Example4">Senha</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <!-- Checkbox "Lembre-me" -->
                        <div class="form-check mb-0">
                            <input class="form-check-input me-2" type="checkbox" name="remember_me" id="form2Example3" />
                            <label class="form-check-label" for="form2Example3">Lembre-me</label>
                        </div>
                        <!-- Botão "Esqueceu a senha?" -->
                        <div class="d-flex">
                            <a href="{% url 'redefinir' %}" class="btn btn-success ms-auto">Esqueceu a senha?</a>
                        </div>
                    </div>

                    <!-- Botão de Login -->
                    <div class="text-center text-lg-start mt-4 pt-2">
                        <button type="submit" class="btn btn-success btn-lg"
                            style="padding-left: 2.5rem; padding-right: 2.5rem;">Entrar</button>
                        <p class="small fw-bold mt-2 pt-1 mb-0">Não tem uma conta? <a href="{% url 'registro' %}" class="link-danger">Registre-se</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Rodapé colado na parte de baixo -->
    <div class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-success mt-auto">
        <!-- Copyright -->
        <div class="text-white mb-3 mb-md-0">
            Copyright © 2020. All rights reserved.
        </div>
        <!-- Redes Sociais -->
        <div>
            <a href="#!" class="text-white me-4">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#!" class="text-white me-4">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="#!" class="text-white me-4">
                <i class="fab fa-google"></i>
            </a>
            <a href="#!" class="text-white">
                <i class="fab fa-linkedin-in"></i>
            </a>
        </div>
    </div>
</section>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock 'conteudo' %}
